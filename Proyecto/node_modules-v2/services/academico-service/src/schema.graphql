type Query {
  carreras: [Carrera!]!
  materias: [Materia!]!
  periodos: [Periodo!]!
  perfilAcademico(usuarioId: ID!): PerfilAcademico
  asignaciones(periodoId: ID): [AsignacionMateria!]!
  inscripciones(alumnoId: ID!): [Inscripcion!]!
  calificaciones(inscripcionId: ID!): [Calificacion!]!
  faltas(inscripcionId: ID!): [Falta!]!
  examenes(asignacionMateriaId: ID!): [Examen!]!
}

type Mutation {
  crearCarrera(input: CarreraInput!): Carrera!
  crearMateria(input: MateriaInput!): Materia!
  crearPeriodo(input: PeriodoInput!): Periodo!
  guardarPerfilAcademico(input: PerfilAcademicoInput!): PerfilAcademico!
  crearAsignacionMateria(input: AsignacionMateriaInput!): AsignacionMateria!
  inscribirAlumno(input: InscripcionInput!): Inscripcion!
  registrarCalificacion(input: CalificacionInput!): Calificacion!
  registrarFalta(input: FaltaInput!): Falta!
  registrarExamen(input: ExamenInput!): Examen!
  registrarHorasBecarias(input: HorasInput!): HorasBecarias!
  registrarHorasComplementarias(input: HorasInput!): HorasComplementarias!
}

type Carrera { id: ID!, nombre: String! }
type Materia { id: ID!, nombre: String!, creditos: Float! }
type Periodo { id: ID!, nombre: String!, fechaInicio: String!, fechaFin: String! }
type PerfilAcademico { id: ID!, usuarioId: ID!, carreraId: ID!, semestre: Int!, creditosAcumulados: Float! }
type AsignacionMateria { id: ID!, materiaId: ID!, profesorId: ID!, periodoId: ID!, grupo: String! }
type Inscripcion { id: ID!, alumnoId: ID!, asignacionMateriaId: ID!, estado: String! }
type Calificacion { id: ID!, inscripcionId: ID!, valor: Float!, fechaRegistro: String! }
type Falta { id: ID!, inscripcionId: ID!, fecha: String!, tipo: String!, observacion: String }
type Examen { id: ID!, asignacionMateriaId: ID!, periodoId: ID!, fecha: String!, ubicacionId: ID! }
type HorasBecarias { id: ID!, alumnoId: ID!, periodoId: ID!, horas: Float!, concepto: String! }
type HorasComplementarias { id: ID!, alumnoId: ID!, periodoId: ID!, horas: Float!, concepto: String! }

input CarreraInput { nombre: String! }
input MateriaInput { nombre: String!, creditos: Float! }
input PeriodoInput { nombre: String!, fechaInicio: String!, fechaFin: String! }
input PerfilAcademicoInput { usuarioId: ID!, carreraId: ID!, semestre: Int!, creditosAcumulados: Float }
input AsignacionMateriaInput { materiaId: ID!, profesorId: ID!, periodoId: ID!, grupo: String! }
input InscripcionInput { alumnoId: ID!, asignacionMateriaId: ID!, estado: String }
input CalificacionInput { inscripcionId: ID!, valor: Float!, fechaRegistro: String }
input FaltaInput { inscripcionId: ID!, fecha: String!, tipo: String!, observacion: String }
input ExamenInput { asignacionMateriaId: ID!, periodoId: ID!, fecha: String!, ubicacionId: ID! }
input HorasInput { alumnoId: ID!, periodoId: ID!, horas: Float!, concepto: String! }
