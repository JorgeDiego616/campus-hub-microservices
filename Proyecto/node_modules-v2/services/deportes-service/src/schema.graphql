extend type Query {
  verEquipo(id: ID!): Equipo
  allEquipos: [Equipo!]!
}

extend type Mutation {
  registrarEquipo(nombre: String!, deporte: String!, categoria: String!): Equipo!
}

type Equipo @key(fields: "id") {
  id: ID!
  nombre: String!
  deporte: String!
  categoria: String!
}

type Practica {
  id: ID!
  fecha: String!
  horaInicio: String!
  horaFin: String!
  ubicacion: String!
}

extend type Equipo {
  practicas: [Practica!]!
}

extend type Mutation {
  registrarPractica(
    equipoId: ID!
    fecha: String!
    horaInicio: String!
    horaFin: String!
    ubicacion: String!
  ): Practica!
}

# Reporte analítico usando agregación de MongoDB
type ReportePracticas {
  deporte: String!
  totalPracticas: Int!
  equiposAsociados: [String!]!
}

extend type Query {
  reportePracticasPorDeporte: [ReportePracticas!]!
}