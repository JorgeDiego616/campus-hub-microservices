enum TipoEspacio {
  CANCHA
  GIMNASIO
  SALON
  LABORATORIO
  AUDITORIO
  EDIFICIO
  OTRO
}

input CoordenadasInput {
  latitud: Float!
  longitud: Float!
}

type Coordenadas {
  latitud: Float!
  longitud: Float!
}

type Espacio @key(fields: "id") {
  id: ID!
  nombre: String!
  tipo: TipoEspacio!
  edificio: String!
  piso: Int!
  descripcion: String!
  coordenadas: Coordenadas
  activo: Boolean!
}

input CrearEspacioInput {
  nombre: String!
  tipo: TipoEspacio!
  edificio: String!
  piso: Int!
  descripcion: String
  coordenadas: CoordenadasInput
}

extend type Query {
  espacio(id: ID!): Espacio
  espacios(
    tipo: TipoEspacio
    activo: Boolean
  ): [Espacio!]!
}

extend type Mutation {
  crearEspacio(input: CrearEspacioInput!): Espacio!
  desactivarEspacio(id: ID!): Espacio!
  activarEspacio(id: ID!): Espacio!
}