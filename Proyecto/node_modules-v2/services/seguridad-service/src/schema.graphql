type Rol {
  id: ID!
  nombre: String!
}

extend type Query {
  verUsuario(id: ID!): Usuario
  allUsuarios: [Usuario!]!
  roles: [Rol!]!
}

extend type Mutation {
  registrarUsuario(
    matricula: String!
    nombre: String!
    email: String!
    password: String!
    rol: String!
  ): Usuario!

  login(email: String!, password: String!): AuthPayload!

  logout: Boolean!

  crearRol(nombre: String!): Rol!
}

type Usuario @key(fields: "id") {
  id: ID!
  matricula: String!
  nombre: String!
  email: String!
  rol: String!
  activo: Boolean!
}

type AuthPayload {
  token: String!
  usuario: Usuario!
}