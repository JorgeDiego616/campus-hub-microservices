enum Rol {
  ESTUDIANTE
  ENTRENADOR
  PROFESOR
  ADMIN
  BECARIO
}

extend type Query {
  verUsuario(id: ID!): Usuario
  allUsuarios: [Usuario!]!
}

extend type Mutation {
  registrarUsuario(
    matricula: String!
    nombre: String!
    email: String!
    password: String!
    rol: Rol!
  ): Usuario!

  login(email: String!, password: String!): AuthPayload!
}

type Usuario @key(fields: "id") {
  id: ID!
  matricula: String!
  nombre: String!
  email: String!
  rol: Rol!
  activo: Boolean!
}

type AuthPayload {
  token: String!
  usuario: Usuario!
}